<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国庆特效预览（飘落：五角星 + 旗帜）</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg,#fff2ef,#ffe3dd); color: #7a2018; }
  .hint { padding: 18px; font-size: 14px; }
  .hint b { color: #c81e28; }
  .stage { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .stage i { position: absolute; top: -8vh; display: block; background-size: contain;
    background-repeat: no-repeat; background-position: center;
    animation-name: festFall; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes festFall {
    0%   { transform: translateY(-10vh); }
    100% { transform: translateY(112vh); }
  }
</style>
</head>
<body>
  <div class="hint">
    <p><b>国庆飘落物预览</b>：红色五角星 flag 已改为「红底 + 黄色五角星」（中国风），不再是白底红圆。</p>
    <p>左：national-star.png（金色五角星）　右：national-flag.png（新旗帜）</p>
  </div>
  <div class="stage" id="stage"></div>
<script>
  var DIR = '用户端特用/web/icons/festival/';
  // 复刻 festival_themes.py 的 national fall 描述符
  var fall = [
    { file: 'national-star.png', size: [14, 26], speed: [8, 15] },
    { file: 'national-flag.png', size: [20, 34], speed: [10, 17] }
  ];
  var rnd = function (r) { return r[0] + Math.random() * (r[1] - r[0]); };
  var stage = document.getElementById('stage');
  for (var i = 0; i < 16; i++) {
    var spec = fall[i % fall.length];
    var el = document.createElement('i');
    var sz = rnd(spec.size);
    el.style.backgroundImage = 'url("' + DIR + spec.file + '")';
    el.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    el.style.width = sz.toFixed(0) + 'px';
    el.style.height = sz.toFixed(0) + 'px';
    var dur = rnd(spec.speed);
    el.style.animationDuration = dur.toFixed(1) + 's';
    el.style.animationDelay = (-Math.random() * dur).toFixed(1) + 's';
    el.style.opacity = (0.55 + Math.random() * 0.4).toFixed(2);
    stage.appendChild(el);
  }
</script>
</body>
</html>
