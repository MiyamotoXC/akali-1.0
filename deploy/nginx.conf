# =============================================================================
# 阿卡莉 1.0 反向代理配置（Nginx）
# 关键：透传真实客户端 IP —— 云端「按 IP 限额」依赖 X-Forwarded-For / X-Real-IP，
#       缺失会导致所有人被算作同一个 IP（限流误伤）或限流失效。
# =============================================================================
# 接入日志格式（**必须在 server 块之外**）：log_format 只允许定义在 http 上下文，
# 而本文件由 nginx.conf 的 `include /etc/nginx/conf.d/*.conf;` 引入到 http 内 ——
# 所以它可以写在这里，但**写进 server 块会报 "directive is not allowed here"**
# 并导致 nginx 容器反复重启（实际踩过的坑，2026-09-24）。
# 不记录 query string：口令支持 ?token= 方式进入，按默认格式记 $request 会把口令明文落盘
# （用户口径 2026-09-24：不得泄露 API 等敏感信息）；保留 XFF 便于按 IP 限额排障。
log_format akali_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'xff="$http_x_forwarded_for"';

# =============================================================================
# 压缩（2026-10-03 补）：首页是 **内联 CSS/JS 的单文件**（≈196KB），未压缩时在窄带宽
# 云主机上实测要 ~4s 才能下完（同一时刻 API 只要 40ms —— 慢的是传输不是后台）。
# 开启 gzip 后首页约 40KB，加载体感差别很大。只压文本类，图片本就是压缩格式不重复压。
# =============================================================================
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml image/svg+xml application/manifest+json;

server {
    listen 80;
    server_name _;

    # 上传/请求体上限（攻略 docx 较大）
    client_max_body_size 30m;

    access_log /var/log/nginx/akali.access.log akali_safe;   # 格式定义见文件顶部（不记 query）

    # ---- 静态素材（知识库图片/头像/图标/手册图）：加浏览器缓存 ----
    # 此前没有任何缓存头 → 每次打开页面都重新下全部素材（单张表情图可 1.6MB），
    # 在窄带宽下就是"页面很卡"的主因。这里 7 天缓存；素材更新后用户强刷即可拿到新的。
    # 注：正则 location 优先级高于下面的 location /，故 /kb/ 等不会走 API 分支。
    location ~ ^/(kb|avatar|icons|manual-imgs)/ {
        proxy_pass         http://akali:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 7d;                      # 自动带上 Cache-Control: max-age=604800
    }

    location / {
        proxy_pass         http://akali:8000;
        proxy_http_version 1.1;

        # ---- 真实 IP 透传（务必保留）----
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 遭遇战/长计算耗时较长，放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;

        # 页面/接口不缓存（改完刷新即见），但允许 304 条件请求省流量
        add_header Cache-Control "no-cache";
    }

    # Service Worker 必须可被根作用域加载
    location = /sw.js {
        proxy_pass http://akali:8000/sw.js;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
    }
}
