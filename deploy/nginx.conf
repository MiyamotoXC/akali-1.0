# =============================================================================
# 阿卡莉 1.0 反向代理配置（Nginx）
# 关键：透传真实客户端 IP —— 云端「按 IP 限额」依赖 X-Forwarded-For / X-Real-IP，
#       缺失会导致所有人被算作同一个 IP（限流误伤）或限流失效。
# =============================================================================
# 接入日志格式（**必须在 server 块之外**）：log_format 只允许定义在 http 上下文，
# 而本文件由 nginx.conf 的 `include /etc/nginx/conf.d/*.conf;` 引入到 http 内 ——
# 所以它可以写在这里，但**写进 server 块会报 "directive is not allowed here"**
# 并导致 nginx 容器反复重启（实际踩过的坑，2026-09-24）。
# 不记录 query string：口令支持 ?token= 方式进入，按默认格式记 $request 会把口令明文落盘
# （用户口径 2026-09-24：不得泄露 API 等敏感信息）；保留 XFF 便于按 IP 限额排障。
log_format akali_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'xff="$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    # 上传/请求体上限（攻略 docx 较大）
    client_max_body_size 30m;

    access_log /var/log/nginx/akali.access.log akali_safe;   # 格式定义见文件顶部（不记 query）

    location / {
        proxy_pass         http://akali:8000;
        proxy_http_version 1.1;

        # ---- 真实 IP 透传（务必保留）----
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 遭遇战/长计算耗时较长，放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # Service Worker 必须可被根作用域加载
    location = /sw.js {
        proxy_pass http://akali:8000/sw.js;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
    }
}
