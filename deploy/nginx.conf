# =============================================================================
# 阿卡莉 1.0 反向代理配置（Nginx）
# 关键：透传真实客户端 IP —— 云端「按 IP 限额」依赖 X-Forwarded-For / X-Real-IP，
#       缺失会导致所有人被算作同一个 IP（限流误伤）或限流失效。
# =============================================================================
server {
    listen 80;
    server_name _;

    # 上传/请求体上限（攻略 docx 较大）
    client_max_body_size 30m;

    # 接入日志（排障时确认 $http_x_forwarded_for 是否正确）
    access_log /var/log/nginx/akali.access.log;

    location / {
        proxy_pass         http://akali:8000;
        proxy_http_version 1.1;

        # ---- 真实 IP 透传（务必保留）----
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 遭遇战/长计算耗时较长，放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # Service Worker 必须可被根作用域加载
    location = /sw.js {
        proxy_pass http://akali:8000/sw.js;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
    }
}
