<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#6b8caa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阿卡莉">
<title>阿卡莉1.0 拂晓智能小秘书</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #2b2f36;
    --ink-soft: #6b7280;
    --line: #e5e8ec;
    --accent: #6b8caa;
    --accent-soft: #eef3f7;
    --user: #f6f9fc;   /* 用户气泡冷白（用户口径 2026-09-09：黑描边区分，跳出背景蓝系） */
    --code-bg: #1f2430;
    --code-ink: #e6e6e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 16px;
    display: flex;
    flex-direction: column;
  }
  /* 顶栏 */
  header {
    position: relative; z-index: 1; /* 置于聊天背景层之上，保证清晰显示 */
    /* 顶端背景与聊天背景分开、互不重叠（用户口径 2026-09-22）：
       此前用「半透明 + 毛玻璃」，聊天背景图（main::before，覆盖全视口）会从顶栏
       透上来，两张图在顶栏视觉上叠在一起；现改为**不透明**淡色纯色，顶栏自成一层。
       若 知识库/图片素材/背景/顶端.png 存在，由 JS 加 .has-top-bg 换用顶端专用图。 */
    background-color: #f7f8fa;
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* 顶栏淡色按时段区分（不透明；清晨暖白 / 白天灰白 / 黄昏暖橘 / 夜间冷蓝白）。
     只写 background-color：用 background 简写会把下面的顶端图 background-image 清掉 */
  body.bg-dawn header { background-color: #c9c4be; }
  body.bg-evening header { background-color: #fdf0e6; }
  body.bg-night header { background-color: #e9eef7; }
  /* 顶端专用背景图（--top-bg 由 JS 探测 背景/顶端[_时段].png 后设置）：
     与聊天背景分层显示、互不重叠；探测不到时回落上面的淡色纯色 */
  header.has-top-bg {
    background-image: var(--top-bg);
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .avatar {
    width: 54px; height: 54px; border-radius: 65%;
    background: linear-gradient(135deg, #8fa6b8, #5d7a91);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 悬浮球：默认挂在标题栏（高 72px）内右侧居中，可拖动换位；点击展开工具菜单（位置由 JS 控制） */
  .fab-wrap { position: fixed; left: calc(100vw - 64px); top: 8px; z-index: 60; }
  .fab-ball { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; cursor: grab;
    border: 2px solid var(--line); box-shadow: 0 4px 12px rgba(30, 40, 50, 0.18);
    background: var(--panel); padding: 0; transition: box-shadow .15s;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .fab-ball:active { cursor: grabbing; }
  .fab-ball:hover { box-shadow: 0 6px 16px rgba(30, 40, 50, 0.28); }
  .fab-ball img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .fab-menu { display: none; position: absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    flex-direction: column; gap: 6px; min-width: 136px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px; box-shadow: 0 8px 20px rgba(30, 40, 50, 0.22); }
  .fab-wrap.open .fab-menu { display: flex; }
  .fab-menu .sug-btn { width: 100%; margin: 0; background: var(--accent-soft); }
  .title-wrap { flex: 1; }
  .title { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 13px; color: var(--ink-soft); }
  /* 消息区 */
  main {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    position: relative;
  }
  /* 阿卡莉聊天背景：按时间轮换（背景/清晨·白天·黄昏·夜晚.png，缺图回退阿卡莉.png）
     时段口径（用户 2026-09-13）：清晨 05:30–07:30 / 白天 07:30–17:00 /
     黄昏 17:00–19:00 / 夜间 19:00–05:30。无 class = 白天（基准规则）。
     （2026-09-20 误将其停用，已还原——用户「背景用白色」指的是头像圈底色，非聊天背景） */
  /* 背景图统一走 CSS 变量：同源时用变量默认值（= 原来的相对路径，行为完全不变）；
     扩展插件等跨域场景由 bridge 注入脚本把 --img-* 覆盖为服务器绝对地址
     （用户口径 2026-09-24：用户端要能作为浏览器插件运行）。 */
  :root {
    --img-bg-day: url('/kb/图片素材/背景/白天.png');
    --img-bg-dawn: url('/kb/图片素材/背景/清晨.png');
    --img-bg-evening: url('/kb/图片素材/背景/黄昏.png');
    --img-bg-night: url('/kb/图片素材/背景/夜晚.png');
    --img-akali: url('/kb/图片素材/阿卡莉.png');
  }
  main::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--img-bg-day) center/cover no-repeat fixed,
                var(--img-akali) center/cover no-repeat fixed;
    /* 白天档 70%：此前 .45 太透、白天气泡对比生硬；用户口径 2026-09-09 拉到 70% */
    opacity: .75;
  }
  body.bg-dawn main::before {
    /* 清晨 05:30–07:30 */
    background: var(--img-bg-dawn) center/cover no-repeat fixed,
                var(--img-akali) center/cover no-repeat fixed;
  }
  body.bg-evening main::before {
    /* 黄昏 17:00–19:00 */
    background: var(--img-bg-evening) center/cover no-repeat fixed,
                var(--img-akali) center/cover no-repeat fixed;
  }
  body.bg-night main::before {
    /* 夜间档背景不透明度提到 90% */
    opacity: .90;
    background: var(--img-bg-night) center/cover no-repeat fixed,
                var(--img-akali) center/cover no-repeat fixed;
  }
  main > * { position: relative; z-index: 1; }
  /* align-items 收顶对齐：气泡高度贴合内容，不被 70px 头像拉伸出底部空白 */
  .msg { display: flex; gap: 10px; max-width: 62%; align-items: flex-start; }
  /* 用户自己那行：头像与气泡**垂直居中对齐**（用户口径 2026-09-13；
     阿卡莉那行保持上面的收顶对齐）。flex-start 会随气泡高度把头像吊在顶部。 */
  .msg.user { align-self: flex-end; flex-direction: row-reverse; align-items: center; }
  /* 阿卡莉聊天头像：放大为 70px，展示头部+极少脖子（源图已 head-crop + 肩部检测），整体更醒目 */
  .msg .ava {
    width: 70px; height: 70px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff; overflow: hidden;
  }
  .msg .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg.secretary .ava { background: var(--accent); }
  /* 头像圈底色改白（用户 2026-09-20「头像里的背景用白色」）：原灰 #9aa5b1 会露在
     用户.png 徽章镂空处形成灰环；白底在白聊天/白气泡上更干净（时段背景图下则是白圆盘）。 */
  /* 指挥官头像框与秘书（阿卡莉）同尺寸：不写死 width/height，直接继承默认 .msg .ava 的 70px
     （移动端继承媒体查询的 58px）——这样两端始终一致，改默认尺寸也自动同步。仅底色改白。 */
  .msg.user .ava { background: #f1deb9; }
  /* 头像框与阿卡莉（秘书）同尺寸（桌面/移动继承默认 70/58px，见上方，不再写死）；
     圈内图像缩小 30%：基准为「填满」状态（徽章被裁到圈边），×0.7 ⇒ scale≈0.82，多出的边距由头像白底承接。
     （用户 2026-09-21 口径：缩的是里面东西、不是头像框；头像框要和阿卡莉一致） */
  .msg.user .ava img { transform: translate(0, 4px) scale(1.15); }
  .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; line-height: 1.6;
    word-break: break-word;
  }
  .msg.secretary .bubble { background: #f8f1de; }   /* 阿卡莉气泡米黄（用户口径 2026-09-09） */
  .msg.user .bubble { background: var(--user); border-color: #2b2f36; }   /* 黑描边（--ink 同款黑） */
  .bubble .role-tag { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  /* ===== 节庆主题：中秋（用户口径 2026-09-25）=====
     由 /api/ui_assets 下发 holiday.theme=midautumn 后，JS 给 body 挂 .festival-midautumn：
     ① 头像（页头 + 消息）套月桂金环；② 阿卡莉气泡换米金云纹皮肤；
     ③ 夜空落月 / 桂花 / 玉兔（纯 CSS 动画，pointer-events:none 不挡任何操作）。
     非节庆日 body 上没有这个 class，以下规则全不生效，界面与平时完全一致。 */
  body.festival-midautumn .avatar,
  body.festival-midautumn .msg .ava {
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(245,196,81,.95), 0 0 14px rgba(245,196,81,.5);
  }
  body.festival-midautumn .msg.secretary .bubble {
    background-color: #fff9eb;
    background-image: url('/icons/festival/midautumn-bubble.png');
    background-size: 100% 100%; background-repeat: no-repeat;
    border-color: rgba(214,158,46,.55);
    box-shadow: 0 2px 10px rgba(214,158,46,.18);
  }
  body.festival-midautumn .msg.user .bubble { border-color: rgba(214,158,46,.7); }
  /* 落物层：固定覆盖视口，仅节庆时由 JS 创建 */
  .festival-fall { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .festival-fall i {
    position: absolute; top: -60px; display: block;
    background-repeat: no-repeat; background-size: contain;
    animation-name: festFall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes festFall {
    0%   { transform: translateY(-70px) rotate(0deg); opacity: 0; }
    12%  { opacity: .95; }
    88%  { opacity: .85; }
    100% { transform: translateY(105vh) rotate(220deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    /* 系统开启「减少动态效果」时不落物，只保留金环与气泡皮肤 */
    .festival-fall { display: none; }
  }
  /* 温馨提示：黑底胶囊悬挂在页面最上方中心（样式见 .warm-tip） */
  .warm-tip {
    position: fixed; z-index: 50; /* 悬挂在页面最上方中心（标题栏内），不随滚动移动 */
    top: 14px; left: 50%; transform: translateX(-50%);
    max-width: min(720px, calc(100% - 160px)); text-align: center;
    font-size: 16px; line-height: 1.5; font-weight: 600;
    color: #e6c493;   /* 偏暖柔和的琥珀字色 */
    /* 黑底胶囊：与标题栏淡色底形成对比，居中常驻 */
    background: rgba(20, 24, 30, 0.82);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(230, 196, 147, 0.35);
    border-radius: 999px; padding: 7px 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 横幅滚动轮播：温馨提示 / 事务提醒 两条交替淡入淡出（JS 每 4s 切换 .on） */
  .warm-tip .tip-item { display: none; }
  .warm-tip .tip-item.on { display: inline; animation: tipFade .55s ease; }
  @keyframes tipFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* 提醒类别印记（✉ 邮件 / ⚔ 远征 / 📅 日历）：描边小徽章 */
  .warm-tip .tip-badge {
    display: inline-block; margin-right: 7px; padding: 0 7px;
    border: 1px solid rgba(230, 196, 147, 0.55); border-radius: 6px;
    font-size: 13px; font-weight: 500; color: #e6c493; vertical-align: 1px;
  }
  pre.code {
    background: var(--code-bg); color: var(--code-ink);
    border-radius: 8px; padding: 12px; overflow-x: auto;
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 14px; line-height: 1.5; margin: 8px 0;
    max-height: 420px; overflow-y: auto;
  }
  pre code { white-space: pre; }
  .typing { color: var(--ink-soft); font-style: italic; }

  /* ===== 我的舰船·装备面板（用户本地副本管理） ===== */
  .user-panel-wrap { position: relative; z-index: 1; /* 置于聊天背景层之上 */ padding: 8px 14px 2px; }
  .user-panel-toggle { font-size: 13px; color: var(--accent, #8b5cf6); cursor: pointer; user-select: none;
    display: inline-block; padding: 2px 8px; border: 1px solid rgba(139, 92, 246, .35); border-radius: 10px;
    /* 磨砂轻底：清晰但不生硬 */
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .15s; }
  .user-panel-toggle:hover { background: rgba(255, 255, 255, 0.92); }
  .user-panel { display: none; margin-top: 8px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 10px 12px; font-size: 13px; }
  .user-panel.open { display: block; }
  .up-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .up-head input { flex: 1; min-width: 160px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .up-head button, .up-actions button { padding: 4px 10px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px;
    cursor: pointer; font-size: 13px; }
  .up-head button:hover, .up-actions button:hover { background: #eef2ff; }
  .up-actions button.up-del { border-color: #fca5a5; color: #dc2626; background: #fef2f2; }
  .up-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin-top: 10px; }
  .up-field { display: flex; align-items: center; gap: 4px; }
  .up-field label { color: #475569; width: 44px; flex-shrink: 0; }
  .up-field input { width: 62px; padding: 3px 5px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; text-align: right; }
  .up-field .up-base { color: #94a3b8; font-size: 11px; }
  .up-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .up-list { margin-top: 10px; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
  .up-list-title { color: #64748b; margin-bottom: 4px; }
  .up-chip { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; background: #f1f5f9; border-radius: 8px;
    cursor: pointer; font-size: 12px; color: #334155; }
  .up-chip:hover { background: #e0e7ff; }
  .up-note { color: #94a3b8; font-size: 12px; margin-top: 6px; line-height: 1.5; }

  /* 遭遇战模拟计算轴期间：算力拉满中占位气泡的轻微脉动，提示正在推演 */
  .msg.computing .bubble { animation: arklyCompute 1.1s ease-in-out infinite; }
  @keyframes arklyCompute { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .tool-out { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .tool-out-tag { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  /* 功能选项栏 */
  .quick-actions {
    position: relative; z-index: 1; /* 置于聊天背景层之上，保证清晰显示 */
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .quick-actions .group-label {
    font-size: 12px; color: var(--ink-soft); width: 100%; margin-top: 4px;
  }
  .quick-actions .group-label:first-child { margin-top: 0; }
  .quick-actions button {
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer;
    transition: background .15s, border-color .15s; font-family: inherit;
  }
  .quick-actions button:hover { background: #e0eaf1; border-color: var(--accent); }
  .quick-actions button.danger { color: #b05a5a; }
  .quick-actions button.danger:hover { background: #f4e6e6; border-color: #b05a5a; }
  /* 输入区 */
  footer {
    position: relative; z-index: 1; /* 置于聊天背景层之上，保证清晰显示 */
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 16px;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-family: inherit; font-size: 15px; line-height: 1.5;
    max-height: 160px; min-height: 44px; outline: none;
    background: #fbfcfd;
  }
  textarea:focus { border-color: var(--accent); }
  button.send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 18px; height: 44px; font-size: 15px; cursor: pointer;
    transition: background .15s;
  }
  button.send:hover { background: #5d7a91; }
  button.send:disabled { background: #aab4bf; cursor: not-allowed; }
  button.exit {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 14px; height: 44px; font-size: 15px; cursor: pointer;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  button.exit:hover { background: rgba(0,0,0,0.04); color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  /* 建议按钮组 */
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sug-btn { padding: 6px 14px; font-size: 14px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); border-radius: 14px; cursor: pointer;
    transition: all .15s; }
  .sug-btn:hover { background: var(--accent); color: #fff; }
  .sug-btn:active { transform: scale(0.96); }
  /* 结束本轮按钮：警示色 */
  .sug-end { border-color: #c05050; color: #c05050; }
  .sug-end:hover { background: #c05050; color: #fff; }
  /* 填空表单（算伤害第一步） */
  .fill-form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .fill-row { display: flex; flex-direction: column; gap: 3px; }
  .fill-boss-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .fill-label { font-size: 13px; color: var(--ink-soft); }
  .fill-req { color: #c05050; }
  .fill-input { padding: 6px 10px; font-size: 14px; border: 1px solid var(--ink-soft);
    border-radius: 6px; background: var(--bg); color: var(--ink); outline: none; }
  .fill-input:focus { border-color: var(--accent); }
  .fill-input-error { border-color: #e05656 !important; background: rgba(224,86,86,.08); }
  .fill-error-msg { font-size: 12px; color: #e05656; line-height: 1.4; }
  /* 组队表单：前排/后排 两行三列 */

  @media (max-width: 640px) {

  /* 反馈按钮：常显在阿卡莉气泡**外侧右下角**（用户口径 2026-09-25）。

  .feedback-btn {

  body.festival-midautumn .feedback-btn {
    background: linear-gradient(135deg, #f3cf75, #d69e2e);
    border-color: rgba(255, 248, 230, .95);
  }

  <!-- 标题栏：阿卡莉头像+名称；头像 src 由 /api/ui_assets 返回的默认表情差分统一刷新 -->
  <header>
    <div class="avatar"><img src="/kb/图片素材/阿卡莉.png" alt="阿卡莉"></div>
    <div class="title-wrap">
      <div class="title">阿卡莉</div>
      <div class="subtitle">秘书 · 拂晓智能体</div>
    </div>
  </header>

  <!-- 悬浮球：挂在标题栏阿卡莉头像下方，点击展开工具菜单；逻辑见 JS「功能菜单（悬浮球）」区块 -->
  <div class="fab-wrap" id="fabWrap">
    <button class="fab-ball" id="fabBall" title="工具菜单">
      <img src="/kb/图片素材/背景/悬浮窗.png" alt="工具菜单">
    </button>
    <div class="fab-menu" id="fabMenu">
      <button class="sug-btn" data-cmd="查角色">查角色</button>
      <button class="sug-btn" data-cmd="查攻略">查攻略</button>
      <button class="sug-btn" data-cmd="计算工具">计算工具</button>
      <button class="sug-btn" data-cmd="遭遇战模拟">遭遇战模拟</button>
    </div>
  </div>

  <!-- 温馨提示横幅：固定常驻文案，磨砂轻底（样式见 .warm-tip）；
       事务提醒（后端按占位注释注入 tip-item）与温馨提示共用此横幅，滚动轮播切换 -->
  <div class="warm-tip" id="warmTip"><span class="tip-item">提示：指挥官可对不满意的答复反馈，帮助阿卡莉进步</span><!--AFFAIR_TIP--></div>

  <!-- 我的舰船·装备面板（本地副本）：可折叠；逻辑由下方 JS「用户本地副本管理」区块
       （up* 系列函数）控制——载入角色/改面板值/保存或删增量/刷新已改列表 -->
  <div class="user-panel-wrap">
    <div class="user-panel-toggle" id="upToggle">⚓ 我的舰船 · 装备面板（本地副本）</div>
    <div class="user-panel" id="userPanel">
      <div class="up-head">
        <input id="upShip" placeholder="输入舰名，如 吹雪改 / 胡德 / 光辉…" />
        <button id="upLoad">载入面板</button>
        <button id="upRefresh">刷新列表</button>
      </div>
      <div class="up-fields" id="upFields"><div class="up-note">输入舰名后点「载入面板」，可修改面板数值并保存。计算（遭遇战/PVP/单体）将以副本面板为基础，查询仍显示底层数据。</div></div>
      <div class="up-actions">
        <button id="upSaveAbs">保存（设为输入值）</button>
        <button id="upSaveDelta">保存增量（相对当前值）</button>
        <button class="up-del" id="upRemove">删除该角色（恢复底层）</button>
      </div>
      <div class="up-list">
        <div class="up-list-title">已修改面板的角色：</div>
        <div id="upChips"><span class="up-note">（加载中…）</span></div>
      </div>
    </div>
  </div>

  <!-- 消息区：对话流渲染容器；欢迎语为静态占位，后续消息由 JS addMsg/renderSecretaryReply 动态插入。
       秘书头像（.ava img）会按后端解析出的 <<EXP:神态>> 表情差分图逐条切换 -->
  <main id="messages">
    <div class="msg secretary">
      <div class="ava"><img src="/kb/图片素材/阿卡莉.png" alt="阿卡莉"></div>
      <div class="bubble">
        <div class="role-tag">阿卡莉</div>
        噢，指挥官，阿卡莉随时待命。直接告诉我你要做什么
      </div>
    </div>
  </main>

  <!-- 输入区：输入框（Enter 发送/Shift+Enter 换行）+ 中断（endTaskBtn，终止当前计算/攻略任务）
       + 关闭（exitBtn）+ 发送（sendBtn）；事件绑定见 JS「发送消息到 /api/chat」区块 -->
  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="聊天或者输入需求，如：查询吹雪改 / 计算南达科他打赤城/查找攻略等"></textarea>
      <button class="exit" id="endTaskBtn" title="中断当前任务（计算/查攻略等），返回主对话流程">中断</button>
      <button class="exit" id="exitBtn" title="关闭网页">关闭</button>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </footer>

<script src="app.js"></script>
</body>
</html>
