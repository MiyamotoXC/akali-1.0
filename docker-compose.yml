# =============================================================================
# 阿卡莉 1.0 云端编排：akali(FastAPI) + nginx(反代/真实IP透传) + redis(配额共享)
#
# 启动：docker compose up -d --build
# 访问：http://<云主机IP>/           （网页端打开 / 或打包 android_app/ WebView APK 直连）
# 日志：docker compose logs -f akali
#
# 【运行模式：默认云端多用户，全部由 .env 控制】
#   本编排**不写死任何业务开关**，运行模式、监听地址、门禁、配额、链接一律读同目录 .env。
#   .env 默认即启用「云端组」（AKALI_RUN_MODE=cloud / HOST=0.0.0.0），runtime.py 在
#   AKALI_RUN_MODE 缺省时也默认 cloud —— 无需手动切换本地/云端。
#   上服务器前只需填好必填项（详见 .env.example / .env.cloud.example 的【二】）：
#     至少需要：AKALI_INVITE_CODE=<你的口令>（其余云端默认值已就位）
#     要限额再加：FX_QUOTA_BACKEND=redis / FX_REDIS_URL=redis://redis:6379/0
#
# 知识库二选一：① 挂载宿主机 知识库/（见下方 volume，最省事）
#               ② 配 FX_KB_BASE_URL + FX_KB_MANIFEST_URL 走对象存储启动同步。
# =============================================================================
services:
  akali:
    build: .
    image: akali:1.0
    restart: unless-stopped
    # 业务开关（运行模式/监听/门禁/配额/链接）的唯一来源：同目录 .env
    env_file:
      - .env
    volumes:
      - akali_data:/data
      # ① 知识库直接挂载（若采用对象存储同步方案，可注释掉本行）
      - ./知识库:/app/知识库
      # ② 用户反馈落盘到**命名卷**（用户口径 2026-09-25，2026-09-28 起改命名卷；
      #    2026-09-29 起本地目录由 调试/反馈收集 改名 反馈信息/反馈收集）：
      #    /api/feedback 写的是 /app/反馈信息/反馈收集/。改用命名卷后，反馈数据彻底脱离
      #    代码目录，部署/重建代码永不会触碰用户反馈，且与 git/rsync 同步完全隔离。
      - akali_feedback:/app/反馈信息/反馈收集
      # ③ 内部测试用户表（用户口径 2026-09-25，2026-09-28 起改命名卷）：
      #    挂载到 /app/users_data，由 AKALI_USERS_FILE 指向其中 users.json。
      #    同样脱离代码目录，本地/部署同步永不会覆盖云端用户数据（改完仍按 mtime 自动生效）。
      - akali_users:/app/users_data
      # ④ 业务代码挂出来（用户口径 2026-09-25：改一点东西就要等好几分钟，太慢）。
      #    原先代码是 COPY 进镜像的，改一行也得 docker compose build（2~3 分钟）。
      #    挂出来后：把新文件拷进宿主机对应目录 → docker compose restart akali（约 5 秒）。
      #    依赖变化（requirements.txt 改动）时才需要重新 build。
      #    注：这两个目录必须先在宿主机存在（本项目一直保持同步，故安全）。
      - ./用户端特用:/app/用户端特用
      - ./通用工具:/app/通用工具
      - ./浏览器扩展:/app/浏览器扩展
    expose:
      - "8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 启用 HTTPS 时取消下一行注释（并先在 deploy/nginx.conf 放开 443 server 块、挂载证书目录）
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 启用 HTTPS（certbot）时需要：证书目录 + ACME webroot（宿主机路径，certbot 在宿主机执行）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      - akali

volumes:
  akali_data:
  redis_data:
  akali_users:
  akali_feedback:
