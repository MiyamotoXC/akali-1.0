# =============================================================================
# 阿卡莉 1.0 云端编排：akali(FastAPI) + nginx(反代/真实IP透传) + redis(配额共享)
#
# 启动：docker compose up -d --build
# 访问：http://<云主机IP>/           （网页端打开 / 手机「添加到主屏幕」）
# 日志：docker compose logs -f akali
#
# 【运行模式：本地 / 云端分开，全部由 .env 控制】
#   本编排**不写死任何业务开关**，运行模式、监听地址、门禁、配额、链接一律读同目录 .env。
#   上服务器前，按 .env.example 的【二】把「云端组」启用（注释掉本地组）、【三】按需填值：
#     至少需要：AKALI_RUN_MODE=cloud / HOST=0.0.0.0 / AKALI_NO_BROWSER=1 /
#               AKALI_PROXY_HEADERS=1 / AKALI_INVITE_CODE=<你的口令>
#     要限额再加：FX_CLOUD_MODE=on / FX_QUOTA_BACKEND=redis / FX_REDIS_URL=redis://redis:6379/0
#   若 .env 仍保持「本地组」（默认），容器会监听 127.0.0.1，宿主与公网都访问不到 —— 属预期行为。
#
# 知识库二选一：① 挂载宿主机 知识库/（见下方 volume，最省事）
#               ② 配 FX_KB_BASE_URL + FX_KB_MANIFEST_URL 走对象存储启动同步。
# =============================================================================
services:
  akali:
    build: .
    image: akali:1.0
    restart: unless-stopped
    # 业务开关（运行模式/监听/门禁/配额/链接）的唯一来源：同目录 .env
    env_file:
      - .env
    volumes:
      - akali_data:/data
      # ① 知识库直接挂载（若采用对象存储同步方案，可注释掉本行）
      - ./知识库:/app/知识库
      # ② 用户反馈落盘到宿主机（用户口径 2026-09-25）：/api/feedback 写的是
      #    /app/调试/反馈收集/，不挂出来就随镜像重建一起丢。挂出来后
      #    直接在服务器 `cat 调试/反馈收集/反馈收集.txt` 即可查看，无需进容器。
      - ./调试/反馈收集:/app/调试/反馈收集
      # ③ 内部测试用户表（用户口径 2026-09-25）：外层 users.json 挂进来，
      #    直接编辑宿主机文件即可增删测试用户，**改完立即生效、无需重启**
      #    （服务端按 mtime 自动重载；总开关与开发者口令仍在 .env）。
      - ./users.json:/app/users.json
      # ④ 业务代码挂出来（用户口径 2026-09-25：改一点东西就要等好几分钟，太慢）。
      #    原先代码是 COPY 进镜像的，改一行也得 docker compose build（2~3 分钟）。
      #    挂出来后：把新文件拷进宿主机对应目录 → docker compose restart akali（约 5 秒）。
      #    依赖变化（requirements.txt 改动）时才需要重新 build。
      #    注：这两个目录必须先在宿主机存在（本项目一直保持同步，故安全）。
      - ./用户端特用:/app/用户端特用
      - ./通用工具:/app/通用工具
      - ./浏览器扩展:/app/浏览器扩展
    expose:
      - "8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 有域名 + 证书时再开 443，并挂载证书目录
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - akali

volumes:
  akali_data:
  redis_data:
